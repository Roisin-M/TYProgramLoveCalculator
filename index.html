<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love Calculator for Kids</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="./scripts.js" ></script>
  <style>
    .card:hover {
      cursor: pointer;
      box-shadow: 0 0 15px pink;
     
    }
    .selected {
      border: 3px solid hotpink;
    }
      body {
    background-image: url('./download.jpeg'); /* You can change this to any image URL */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
  }

  .container {
    background-color: rgba(255, 255, 255, 0.9); /* Makes the content box readable */
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    margin-top: 10%;
    margin-bottom: 10%;
  }
  .card{
    height: 15rem;
  }

  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row text-center">
      <!-- Left Column -->
      <div class="col-md-3 d-flex flex-column gap-4">
        <div class="card" onclick="selectCrush('Spider-Man', this)">
          <img src="./spiderman.jpeg" class="card-img-top" alt="Spider-Man">
          <div class="card-body">
            <h5 class="card-title">Spider-Man</h5>
          </div>
        </div>
        <div class="card" onclick="selectCrush('Princess Peach', this)">
          <img src="./peach.jpeg" class="card-img-top" alt="Princess Peach">
          <div class="card-body">
            <h5 class="card-title">Princess Peach</h5>
          </div>
        </div>
      </div>

      <!-- Center Column (Calculator) -->
      <div class="col-md-6 d-flex align-items-center">
        <div class="card w-100 p-4">
          <h3 class="mb-3">💖 Love Match Calculator</h3>
          <input type="text" id="userName" class="form-control mb-3" placeholder="Enter Your Name">
          <button onclick="calculateLoveMatch()" class="btn btn-danger mb-3">Calculate Match ❤️</button>
          <h4 class="mt-3" id="result"></h4>
        </div>
      </div>

      <!-- Right Column -->
      <div class="col-md-3 d-flex flex-column gap-4">
        <div class="card" onclick="selectCrush('Pikachu', this)">
          <img src="./pika.png" class="card-img-top" alt="Pikachu">
          <div class="card-body">
            <h5 class="card-title">Pikachu</h5>
          </div>
        </div>
        <div class="card" onclick="selectCrush('Mystery Character', this)">
          <img src="./mystery.jpeg" class="card-img-top" alt="Mystery">
          <div class="card-body">
            <h5 class="card-title">Mystery Crush</h5>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
